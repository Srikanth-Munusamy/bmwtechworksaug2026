[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BMWAgent-train-deploy"
version = "0.1.0"
description = "BMW Agent"

requires-python = ">=3.10"
dependencies = [
    "openai",
    "streamlit",
    "boto3",
    "pandas",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "langchain",
    "langchain-openai",
    "langchain-google-genai"
 
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/bmwagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
