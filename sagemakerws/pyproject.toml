[project]
name = "bmw-parts-demand"
version = "1.0.0"
description = "BMW spare-parts demand prediction using Amazon SageMaker"
requires-python = ">=3.11,<3.14"

dependencies = [
    "boto3>=1.40",
    "sagemaker>=2.250,<3",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas",
    "scikit-learn",
    "joblib"
]