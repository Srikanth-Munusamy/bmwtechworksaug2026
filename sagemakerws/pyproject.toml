[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-parts-demand"
version = "1.0.0"
description = "BMW spare-parts demand prediction using Amazon SageMaker"
requires-python = ">=3.9,<3.11"

dependencies = [
    "boto3>=1.40",
    "sagemaker>=2.250,<3",
    "pandas==2.3.3",
    "numpy==1.26.4",
    "scikit-learn==1.2.2",
    "xgboost>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "joblib==1.2.0"
]