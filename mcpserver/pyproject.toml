[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-train-deploy"
version = "0.1.0"
description = "MCP server training and deployment application"
requires-python = ">=3.10,<3.14"

dependencies = [
    "mcp[cli]==1.29.1",

    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "streamlit==1.63.0",

    "langchain==1.4.0",
    "langchain-openai==1.6.0",
    "langchain-mcp-adapters==0.3.2",

    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/salesmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"